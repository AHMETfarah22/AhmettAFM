<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ahmed Farah Mohamed | AFM-CODING</title>
<meta name="description" content="AFM-CODING kurucusu Ahmed Farah Mohamed: full-stack geliştirici. Web siteleri, otel yönetim yazılımı, mobil uygulamalar ve yapay zekâ entegrasyonu.">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('afm-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('anim');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<button class="cord" id="cord" type="button" data-t-aria="lamp">
  <span class="cord-line"><span class="cord-bead"></span></span>
</button>

<header class="nav" id="nav">
  <a class="logo" href="#top" data-t-aria="homeAria">AFM</a>
  <nav data-t-aria="menu" id="nav-links">
    <a href="#top" data-t="home"></a>
    <a href="#kapilar" class="only-small" data-t="doors"></a>
    <a href="#deneyim" data-t="experience"></a>
    <a href="#iletisim" data-t="contact"></a>
  </nav>
  <div class="lang" id="lang" role="group" aria-label="Dil, Language, Luqad">
    <button type="button" data-lang="tr" aria-label="Türkçe">TR</button>
    <button type="button" data-lang="en" aria-label="English">EN</button>
    <button type="button" data-lang="so" aria-label="Soomaali">SO</button>
  </div>
</header>

<main>
  <section class="hero" id="top">
    <div class="hero-text">
      <p class="hero-role" data-t="heroRole"></p>
      <h1 class="words" data-start="0" data-t="hi"></h1>
      <p class="hero-am words" data-t="iam"></p>
      <div class="pad" id="pad" aria-live="off"></div>
      <div class="hero-actions">
        <a class="pill" href="#iletisim"><span data-t="start"></span><span class="pill-knob" aria-hidden="true"></span></a>
        <button class="textlink" type="button" id="see-sites" data-t="seeSites"></button>
      </div>
    </div>

    <div class="hero-door">
      <div class="hero-arch">
        <img src="https://afmcoding.com/assets/ahmed-farah-mohamed-afm-coding.jpg" width="896" height="1195" data-t-alt="portrait" alt="">
        <span class="keystone" aria-hidden="true"></span>
        <span class="hero-leaf" aria-hidden="true"><span class="plaque">AFM</span><span class="plate"></span><span class="handle"></span></span>
      </div>
    </div>

    <ul class="hero-strip">
      <li data-t="strip1"></li>
      <li data-t="strip2"></li>
      <li data-t="strip3"></li>
    </ul>
  </section>

  <section class="doors" id="kapilar">
    <div class="stage" id="stage">
      <h2 class="words" data-t="doorsTitle"></h2>
      <div class="rail" id="rail"></div>
      <div class="floor" aria-hidden="true"></div>
      <div class="infos" id="infos"></div>
    </div>
  </section>

  <div class="night">
    <section class="past" id="deneyim">
      <div class="past-stage" id="past-stage">
        <div class="past-left">
          <h2 class="words" data-t="pastTitle"></h2>
          <p class="past-big" id="past-big" aria-hidden="true"></p>
        </div>
        <ol class="past-list" id="past-list"></ol>
      </div>
    </section>

    <section class="contact" id="iletisim">
      <h2 id="contact-title"></h2>
      <p data-t="contactP"></p>
      <a class="pill pill-light" href="https://wa.me/905416264074" target="_blank" rel="noopener"><span data-t="whatsapp"></span><span class="pill-knob" aria-hidden="true"></span></a>
      <ul class="contact-links">
        <li><a href="tel:+905416264074">+90 541 626 4074</a></li>
        <li><a href="tel:+252907554481">+252 90 755 4481</a></li>
        <li><a href="https://www.instagram.com/ahmett_kr12/?hl=en" target="_blank" rel="noopener">Instagram</a></li>
        <li><a href="https://github.com/AHMETfarah22" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="https://afmcoding.com/" target="_blank" rel="noopener">afmcoding.com</a></li>
      </ul>
      <p class="fine">© 2026 Ahmed Farah Mohamed, AFM-CODING</p>
    </section>
  </div>
</main>

<dialog id="room" aria-labelledby="room-title">
  <div class="room-bar"><button type="button" id="back" data-t="back"></button></div>
  <div id="room-body"></div>
</dialog>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
